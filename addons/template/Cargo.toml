[package]
name = "beispiel-addon"
version = "0.1.0"
edition = "2021"

# Eigenstaendig, nicht Teil des Client-Arbeitsbereichs.
[workspace]

# Ein Addon ist eine WebAssembly-Bibliothek; der Client laedt die .wasm-Datei.
[lib]
crate-type = ["cdylib"]

[dependencies]
coral-addon = { path = "../../crates/addon_api" }

# Klein und schnell geladen.
[profile.release]
opt-level = "s"
lto = true
strip = true
