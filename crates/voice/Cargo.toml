[package]
name = "voice"
edition.workspace = true
version.workspace = true

# Sprachchat, kompatibel zu Simple Voice Chat: Plugin-Kanaele, verschluesselte UDP-Verbindung
# und Opus. Alles in reinem Rust (aes-gcm, opus-rs) -- keine C-Abhaengigkeit, der Client bleibt
# mit einem schlichten "cargo build" baubar.
[dependencies]
protocol = { path = "../protocol" }
aes-gcm = "0.10"
opus-rs = "0.1.34"
rand = "0.8"
# Rauschunterdrueckung: RNNoise in reinem Rust (wie der Denoiser der Mod).
nnnoiseless = { version = "0.5", default-features = false }

[lints]
workspace = true
