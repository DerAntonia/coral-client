[package]
name = "app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "coral-client"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
net = { path = "../net" }
auth = { path = "../auth" }
render = { path = "../render" }
world = { path = "../world" }
chunk_saver = { path = "../chunk_saver" }
assets = { path = "../assets" }
audio = { path = "../audio" }
voice = { path = "../voice" }
winit.workspace = true
tokio.workspace = true
wgpu.workspace = true
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
arboard = "3"
glam = "0.29"
# TTF-Rasterung fuer die DM-Sans-Schrift (s. font_atlas.rs).
ab_glyph = "0.2"
rustc-hash.workspace = true
# Hintergrundbild des Startbildschirms (s. wallpaper.rs): Fotos sind meist JPEG oder WebP.
# Datum/Uhrzeit fuer den Chat-Log (s. chat_log.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Die Launcher-Szene ist zlib-gepackt (s. src/hero_scene.rs).
flate2 = "1"
# Fehlermeldungen von wgpu ins client.log (s. WgpuLog in main.rs).
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
# Die Kreativ-Tabs nennen Server-Registry-Verweise als JSON (s. creative.rs).
serde_json = "1"
# Server-Icons im Status-Ping kommen als Base64-PNG (s. server_status.rs).
base64 = "0.22"
# Addons (s. addons.rs): WebAssembly-Module, uebersetzt mit Cranelift, und ihre Schnittstelle.
# 48: die letzte Version fuer Rust 1.95 (s. .github/workflows/clippy.yml).
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
coral-addon = { path = "../addon_api" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xkb", "composite", "present", "dri3"] }
libc = "0.2"
evdev = "0.12"

# CPU-Name aus der Registry und Arbeitsspeicher fuer den System-Abschnitt (s. system_info.rs),
# VBlank-Zeitstempel und Uhr fuer Scanout-Timing (s. vblank.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_Graphics_Gdi",
    "Wdk_Graphics_Direct3D",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemInformation",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
# Nur zum Pruefen der WGSL-Dateien im Test (s. tests/shaders.rs) -- dieselbe Version, die
# wgpu ohnehin zieht, also kein zusaetzlicher Download.
naga = { version = "22", features = ["wgsl-in"] }
# Test-Addons als WAT-Text (s. addons.rs).
wat = "1"

[lints]
workspace = true
